services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servuae-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - servuae

  nginx:
    image: nginx:1.28-alpine
    container_name: servuae-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - servuae

  mysql:
    image: mysql:8.4
    container_name: servuae-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-servuae}
      MYSQL_USER: ${DB_USERNAME:-servuae}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - servuae-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - servuae

  node:
    image: node:22-alpine
    container_name: servuae-node
    working_dir: /var/www/html
    profiles: ["frontend"]
    volumes:
      - ./:/var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - servuae

networks:
  servuae:
    driver: bridge

volumes:
  servuae-mysql-data:
